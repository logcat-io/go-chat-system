# 복사 위치: .github/workflows/ci.yml
# ./scripts/verify.sh 와 같은 검사를 GitHub 러너에서 돌린다. 배포 워크플로가 workflow_call 로 먼저 부른다.
# 잡을 나눠 동시에 돈다(2026-10-10). DB 가 필요 없는 검사(checks)와 DB 테스트(test, 패키지 묶음 셋)는 서로를 기다리지 않는다.
# 테스트는 설정이 DB 전역이라 한 잡 안에서는 `-p 1` 이다 — 묶음마다 자기 compose(Postgres·MinIO)를 띄우니 묶음끼리는 겹치지 않는다.
name: CI

on:
  pull_request:
  push:
    # develop 과 태그는 배포 워크플로가 이 파일을 불러 돌린다. 같은 커밋을 두 번 돌리지 않는다.
    branches-ignore: [develop]
    tags-ignore: ["v*"]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # 클라이언트 유실 방지 테스트는 Node 24 이상이 필요하다(README).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal ./web)
          if [ -n "$unformatted" ]; then echo "포맷이 안 된 파일:"; echo "$unformatted"; exit 1; fi

      - name: go mod tidy 와 같은지
        run: go mod tidy -diff

      - name: go vet
        run: go vet ./...

      # 버전은 scripts/verify.sh 의 GOLANGCI_LINT_VERSION 과 같게 둔다. 설정은 .golangci.yml.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

      - name: build
        run: go build ./...

      # docs/ 는 로컬 전용이라(.gitignore) 클론에는 가이드가 없다. 있을 때만 대조한다.
      - name: 가이드 코드 블록이 코드와 같은지
        if: hashFiles('docs/guide/INDEX.md') != ''
        run: python3 scripts/guide-embed.py --check

      # 프론트 검사는 package.json 의 스크립트가 정한다. 없던 때의 리포면 클라이언트 테스트만 node 로 돈다.
      - name: 프론트 의존성
        if: hashFiles('package.json') != ''
        run: npm ci

      - name: 프론트 검사(css·lint·test)
        if: hashFiles('package.json') != ''
        run: |
          npm run css:check
          npm run lint
          npm test

      - name: 클라이언트 테스트
        if: hashFiles('package.json') == ''
        run: node --test web/assets/*.test.mjs

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # 한 조각이 실패해도 나머지는 끝까지 돌아 실패를 한 번에 본다.
      fail-fast: false
      matrix:
        # 오래 걸리는 두 패키지는 테스트 함수 단위로 더 나눈다(CI 실측: httpapi 테스트 합 395초, realtime 169초 — docs/perf).
        # part/of 는 이름순으로 센 테스트의 순번 나머지다. 새 테스트는 어느 조각엔가 저절로 들어간다.
        include:
          - { pkg: httpapi, part: 0, of: 3 }
          - { pkg: httpapi, part: 1, of: 3 }
          - { pkg: httpapi, part: 2, of: 3 }
          - { pkg: realtime, part: 0, of: 2 }
          - { pkg: realtime, part: 1, of: 2 }
          - { pkg: rest, part: 0, of: 1 }
    name: test (${{ matrix.pkg }} ${{ matrix.part }}/${{ matrix.of }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # 조각에 들 패키지와 테스트를 고른다. rest 는 두 패키지를 뺀 전부라 새 패키지가 생겨도 빠지지 않는다.
      # 테스트 이름은 소스에서 읽는다(`go test -list` 는 컴파일을 한 번 더 한다). 둘이 같은지는 docs/perf 에 적은 방법으로 확인했다.
      - name: 패키지·테스트 고르기
        id: pkgs
        run: |
          mod=$(go list -m)
          run=""
          if [ "${{ matrix.pkg }}" = rest ]; then
            pkgs=$(go list ./... | grep -v -x -e "$mod/internal/adapter/httpapi" -e "$mod/internal/adapter/realtime" | tr '\n' ' ')
          else
            pkgs="$mod/internal/adapter/${{ matrix.pkg }}"
            names=$(grep -hoE '^func (Test[^(]*)\(t \*testing\.T\)' internal/adapter/${{ matrix.pkg }}/*_test.go \
              | sed -E 's/^func (Test[^(]*)\(.*/\1/' | LC_ALL=C sort \
              | awk -v k=${{ matrix.part }} -v n=${{ matrix.of }} '(NR-1)%n==k')
            if [ -z "$names" ]; then echo "이 조각에 테스트가 없다"; exit 1; fi
            count=$(echo "$names" | wc -l | tr -d ' ')
            echo "테스트 ${count}개"
            run="^($(echo "$names" | paste -sd'|' -))\$"
            echo "count=$count" >> "$GITHUB_OUTPUT"
          fi
          echo "고른 패키지: $pkgs"
          echo "list=$pkgs" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      # Postgres 서비스 컨테이너 대신 리포의 compose 를 그대로 띄운다.
      # 서비스 컨테이너는 명령 인자를 못 바꿔서 compose 의 `-c max_connections=300` 과 MinIO 의 `server /data` 를 줄 수 없다.
      # 로컬 verify.sh 와 같은 DB 설정(포트 56432, fsync·synchronous_commit on)으로 돈다.
      - name: Postgres·MinIO 띄우기
        run: docker compose up -d --wait

      - name: go test -race
        run: |
          set -o pipefail
          go test -race -p 1 -count=1 -v -run "${{ steps.pkgs.outputs.run }}" ${{ steps.pkgs.outputs.list }} 2>&1 | tee test.log

      # 리포의 t.Skip 은 전부 "기반이 없어 못 돈다" 다: Postgres 에 못 붙음, 격리 DB 를 못 만듦(CREATEDB 없음), MinIO 에 못 닿음.
      # CI 에서 건너뛰면 유실 방지 테스트가 하나도 안 돈 채 초록불이 켜진다. 문구를 고르지 않고 `--- SKIP` 줄 자체를 실패로 본다.
      # 새 건너뛰기 사유가 생겨도 여기서 걸린다.
      # -run 정규식이 틀리면 go test 는 "no tests to run" 경고만 내고 통과한다. 고른 수만큼 실제로 돌았는지 센다.
      - name: 고른 테스트가 다 돌았는지
        if: steps.pkgs.outputs.count != ''
        run: |
          ran=$(grep -cE '^=== RUN   Test[^/]*$' test.log || true)
          echo "고른 ${{ steps.pkgs.outputs.count }}개, 돈 ${ran}개"
          [ "$ran" = "${{ steps.pkgs.outputs.count }}" ] || { echo "고른 테스트와 돈 테스트의 수가 다르다"; exit 1; }

      - name: 건너뛴 테스트가 없는지
        run: |
          if grep -E -- "--- SKIP" test.log; then
            echo "건너뛴 테스트가 있다. 위 줄의 사유(DB·격리 DB·MinIO)를 본다."; exit 1
          fi

      - name: compose 정리
        if: always()
        run: docker compose down -v
